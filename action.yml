name: Spark Gate
description: Replay agent traces across Meta model versions and block the PR when an upgrade regresses.
author: Jayanth Dolai
branding:
  icon: shield
  color: blue

inputs:
  config:
    description: Path to sparkgate.yaml
    default: sparkgate.yaml
  candidates:
    description: Space-separated candidate models to gate (default = candidates in the config)
    default: ""
  fail-on:
    description: "dont_ship (default), not_ship (also fail on ship_with_fix) or never"
    default: dont_ship
  comment:
    description: Post the report as a pull-request comment
    default: "true"
  python-version:
    default: "3.12"

outputs:
  exit-code:
    description: 0 = gate passed, 1 = gate failed, 2 = configuration error
    value: ${{ steps.gate.outputs.exit-code }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Spark Gate
      shell: bash
      run: python -m pip install --disable-pip-version-check --quiet "$GITHUB_ACTION_PATH"

    # Inputs reach the shell only through environment variables, never through
    # ${{ }} interpolation inside the script, so they cannot inject commands.
    - name: Run gate
      id: gate
      shell: bash
      env:
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_CANDIDATES: ${{ inputs.candidates }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set +e
        args=(--config "$INPUT_CONFIG" --fail-on "$INPUT_FAIL_ON" --markdown "$RUNNER_TEMP/sparkgate-report.md")
        read -r -a cands <<< "$INPUT_CANDIDATES"
        for c in "${cands[@]}"; do args+=(--candidate "$c"); done
        sparkgate run "${args[@]}"
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

    - name: Comment on pull request
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        report="$RUNNER_TEMP/sparkgate-report.md"
        if [[ -s "$report" ]]; then
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$report"
        fi

    - name: Enforce verdict
      shell: bash
      env:
        CODE: ${{ steps.gate.outputs.exit-code }}
      run: exit "${CODE:-2}"
