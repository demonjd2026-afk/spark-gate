# Spark Gate configuration. Secrets are never stored here: each endpoint names the
# environment variable that holds its key.

baseline: muse-spark-1.1            # the version the agent runs on today
candidates:                          # versions you are considering; a candidate whose
  - muse-spark-1.2                   # endpoint has no key set is skipped, not failed
  - muse-spark-1.3                   # (pass --strict to fail instead)
  - muse-spark-open                  # open weights on Baseten
  - muse-spark-open-fireworks        # same open weights on Fireworks
  - muse-glimmer-30b                 # open weights on your own endpoint (e.g. Modal)

traces: traces/support_agent.jsonl

endpoints:
  meta:                              # Meta Model API (OpenAI-compatible)
    base_url: https://api.meta.ai/v1
    api_key_env: MODEL_API_KEY
  baseten:                           # Baseten Model APIs (OpenAI-compatible)
    base_url: https://inference.baseten.co/v1
    api_key_env: BASETEN_API_KEY
  fireworks:                         # Fireworks serverless (OpenAI-compatible)
    base_url: https://api.fireworks.ai/inference/v1
    api_key_env: FIREWORKS_API_KEY
  glimmer:                           # any OpenAI-compatible server you run for Muse Glimmer
    base_url_env: GLIMMER_BASE_URL   # e.g. a Modal endpoint
    api_key_env: GLIMMER_API_KEY

models:
  # Standard tier (prompts are not used for training). USD per million tokens.
  muse-spark-1.1: {endpoint: meta, input_per_mtok: 1.25, output_per_mtok: 4.25, cached_input_per_mtok: 0.15}
  muse-spark-1.2: {endpoint: meta, input_per_mtok: 1.25, output_per_mtok: 4.25, cached_input_per_mtok: 0.15}
  muse-spark-1.3: {endpoint: meta, input_per_mtok: 1.25, output_per_mtok: 4.25, cached_input_per_mtok: 0.15}
  muse-spark-open:
    endpoint: baseten
    wire_model: meta-models/muse-spark-open-1026   # the hackathon id from the event guide
    hosting: open_weights
    served_by: Baseten
    # Price not set: Baseten has not published one we could verify, so the cost check is
    # skipped for this model rather than reporting a made-up number.
  muse-spark-open-fireworks:
    endpoint: fireworks
    wire_model: accounts/fireworks/models/muse-spark-open
    hosting: open_weights
    served_by: Fireworks
    input_per_mtok: 1.25             # Fireworks serverless list price
    output_per_mtok: 4.25
    cached_input_per_mtok: 0.15
  muse-glimmer-30b:
    endpoint: glimmer
    wire_model: meta-models/Muse-Glimmer-30B   # the id your server expects; change to match it
    hosting: open_weights
    served_by: Modal
    # Billed per GPU-hour on your own endpoint, so no per-token price: the cost check is
    # skipped for this model. Set a per-token rate here if your host charges one.

judge:                               # pairwise, position-swapped quality judge
  enabled: true
  model: muse-spark-1.3

fixer:                               # diagnoses each regression pattern and proposes a prompt fix
  enabled: true
  model: muse-spark-1.3
  max_patterns: 4
  examples_per_pattern: 3

gate:
  min_policy_pass: 0.95              # share of traces whose per-trace policy expectations all hold
  min_tool_fidelity: 0.90            # share of traces with the same tool sequence as baseline
  min_schema_valid: 0.95             # share of final answers that validate against the schema
  max_quality_loss: 0.10             # share of traces the judge says got worse (both orderings)
  max_latency_p95_ratio: 1.50
  max_cost_ratio: 1.50
  max_errors: 0
  side_effect_tools:                 # tools that change the world -> argument changes are regressions
    issue_refund: [reason]           # listed args are free text and ignored when comparing
    create_ticket: [summary]

runtime:
  concurrency: 6
  max_tool_turns: 8
  temperature: 0
  max_output_tokens: 2048
  request_timeout_s: 120
  max_retries: 5
  budget_usd: 15                     # hard ceiling for one run
